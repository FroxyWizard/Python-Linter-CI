name: Python Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Show runner details
    run: |
      echo "Runner OS:"
      uname -a
  
      echo "CPU cores:"
      nproc
  
      echo "CPU information:"
      lscpu
  
      echo "Memory:"
      free -h
  
      echo "Disk:"
      df -h
  
      echo "Runner architecture:"
      echo $RUNNER_ARCH
  
      echo "Runner OS variable:"
      echo $RUNNER_OS
  
      echo "Runner name:"
      echo $RUNNER_NAME
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: ruff check .
